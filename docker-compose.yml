networks:
  radares-net:
    external: true

services:

  # ═══════════════════════════════════════════════
  #  MICROSSERVIÇO — Radar MonitoraSP (Quarkus)
  # ═══════════════════════════════════════════════
  quarkus-radar-rondon:
    container_name: quarkus-radares-monitorasp
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8091:8091"
    env_file:
      - .env
    environment:
      - QUARKUS_PROFILE=prod

      # ── MongoDB ───────────────────────────────
      - MONGODB_URI=mongodb:${URI_MONGODB}
      - MONGODB_DATABASE=${DATABASE_MONGODB}

      # ── RabbitMQ ──────────────────────────────
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - rabbitmq.exchange.name=radares_exchange
      - rabbitmq.routing.key=radares.monitorasp

      # ── CORS ──────────────────────────────────
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://192.168.0.251:3000,http://192.168.0.251:5173
    networks:
      - radares-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://localhost:8091/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s